[versions]
# Built-in Kotlin remains enabled; JVM/Compose plugins align the compiler version.
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.12"
composeBom = "2026.09.00"
coreKtx = "1.19.0"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation3 = "1.1.7"
adaptive = "1.3.0"
hilt = "2.60.1"
androidxHilt = "1.4.0"
room = "3.0.3"
sqlite = "2.7.1"
datastore = "1.2.1"
work = "2.11.2"
coroutines = "1.10.2"
serialization = "1.9.0"
coil = "3.6.2"
media3 = "1.11.1"
smbj = "0.15.0"
slf4j = "2.0.17"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
