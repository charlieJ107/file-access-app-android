name: Publish Android release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/release'
    uses: ./.github/workflows/android-ci.yml

  release:
    needs: checks
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and release destination
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-release.py

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true
          dependency-graph: disabled
          build-scan-publish: false

      - name: Ensure Android SDK packages
        run: |
          sdk_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ -x "$sdk_bin/android" ]]; then
            "$sdk_bin/android" --no-metrics --sdk="$ANDROID_HOME" sdk install platforms/android-37.0
            "$sdk_bin/android" --no-metrics --sdk="$ANDROID_HOME" sdk install build-tools/36.0.0
          else
            "$sdk_bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
              'platforms;android-37.0' 'build-tools;36.0.0' </dev/null
          fi
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Build and verify signed APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/fileaccess-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing signing keystore}"
          : "${RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${RELEASE_KEY_ALIAS:?Missing signing alias}"
          : "${RELEASE_KEY_PASSWORD:?Missing key password}"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"
          ./gradlew --no-daemon --console=plain --max-workers=2 :app:assembleRelease :app:lintRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p build/release
          cp app/build/outputs/apk/release/app-release.apk "build/release/fileaccess-$VERSION_CODE.apk"
          cd build/release
          sha256sum "fileaccess-$VERSION_CODE.apk" > SHA256SUMS

      - name: Create draft, upload and publish release using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_EXISTS: ${{ steps.version.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EXISTS" != "true" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "FileAccess $TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "build/release/fileaccess-$VERSION_CODE.apk" build/release/SHA256SUMS --clobber
          # The app requires GitHub's SHA-256 digest; never publish incomplete assets.
          # Pending draft tags have no REST /releases/tags lookup. gh resolves drafts by ID.
          release_id="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > build/release/metadata.json
          python3 scripts/verify-release-assets.py build/release/metadata.json "build/release/fileaccess-$VERSION_CODE.apk"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fileaccess-release.jks"
